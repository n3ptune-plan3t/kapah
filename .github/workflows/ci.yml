name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Forced software rendering everywhere: llvmpipe or no DRI at all.
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  QT_QPA_PLATFORM: wayland
  QT_QUICK_BACKEND: software

jobs:
  banned-symbols:
    name: banned symbols / no QML / no GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject QOpenGL / QQuick / QML / QtWebEngine / .qml / .ui
        run: ci/check-banned-symbols.sh
      - name: Require software-rendering hardening
        run: ci/check-env-hardening.sh

  build:
    name: build (${{ matrix.build }})
    runs-on: ubuntu-latest
    container: fedora:41
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release, release-small]
    steps:
      - name: Install dependencies
        run: |
          set -x
          dnf install -y git cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtwayland-devel qt6-qtwayland-private-devel \
            libpulse-devel systemd-devel pam-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel pkgconf-pkg-config \
            mesa-dri-drivers mesa-libGL-devel libglvnd-devel
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src
          cd src
          git checkout "$GITHUB_SHA"
      - name: Configure
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DKAPAH_WERROR=ON \
            -DKAPAH_RELEASE_SMALL=${{ matrix.build == 'release-small' }}
      - name: Build
        working-directory: src
        run: cmake --build build -j"$(nproc)"
      - name: Unit + headless tests
        working-directory: src
        run: ctest --test-dir build --output-on-failure -LE integration
      - name: Report binary sizes
        working-directory: src
        run: |
          ls -la build/bin/ || true
          size build/bin/* || true

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install dependencies
        run: |
          set -x
          dnf install -y git cmake ninja-build gcc-c++ clang clang-tools-extra \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtwayland-devel qt6-qtwayland-private-devel \
            libpulse-devel systemd-devel pam-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel pkgconf-pkg-config \
            mesa-dri-drivers mesa-libGL-devel libglvnd-devel
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src
          cd src
          git checkout "$GITHUB_SHA"
      - name: Run
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build -j"$(nproc)"

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install dependencies
        run: |
          set -x
          dnf install -y git cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtwayland-devel qt6-qtwayland-private-devel \
            libpulse-devel systemd-devel pam-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel pkgconf-pkg-config \
            mesa-dri-drivers mesa-libGL-devel libglvnd-devel
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src
          cd src
          git checkout "$GITHUB_SHA"
      - name: Build
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKAPAH_ENABLE_ASAN=ON
          cmake --build build -j"$(nproc)"
      - name: Test
        working-directory: src
        run: ctest --test-dir build --output-on-failure -LE integration

  fuzz:
    name: parser fuzzers (60s smoke)
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install dependencies
        run: |
          set -x
          dnf install -y git cmake ninja-build clang \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtwayland-devel qt6-qtwayland-private-devel \
            libpulse-devel systemd-devel pam-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel pkgconf-pkg-config \
            mesa-dri-drivers mesa-libGL-devel libglvnd-devel
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src
          cd src
          git checkout "$GITHUB_SHA"
      - name: Build fuzzers
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DKAPAH_ENABLE_FUZZERS=ON -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build -j"$(nproc)"
      - name: Smoke-run each corpus seed
        working-directory: src
        run: tools/perf/run-fuzzers.sh

  integration:
    name: integration (nested niri, software rendering)
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install dependencies
        run: |
          set -x
          dnf install -y git cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtwayland-devel qt6-qtwayland-private-devel \
            libpulse-devel systemd-devel pam-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel pkgconf-pkg-config \
            mesa-dri-drivers mesa-libGL-devel libglvnd-devel \
            dbus dbus-x11 python3-dbusmock xvfb mesa-utils
          dnf copr enable -y yalter/niri || true
          dnf install -y niri || true
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src
          cd src
          git checkout "$GITHUB_SHA"
      - name: Build
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Run integration suite
        working-directory: src
        run: tests/integration/run-all.sh

  perf:
    name: perf gate (PSS + wakeups)
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install dependencies
        run: |
          set -x
          dnf install -y git cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtwayland-devel qt6-qtwayland-private-devel \
            libpulse-devel systemd-devel pam-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel pkgconf-pkg-config \
            mesa-dri-drivers mesa-libGL-devel libglvnd-devel \
            dbus
          dnf copr enable -y yalter/niri || true
          dnf install -y niri || true
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src
          cd src
          git checkout "$GITHUB_SHA"
      - name: Build
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Regression gate
        working-directory: src
        run: tools/perf/perf-gate.sh
